<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
        
        <form id="checkout-form">
          <fieldset>
            <legend>Shipping Information</legend>
            
            <label for="fname">First Name <span class="required">*</span></label>
            <input type="text" id="fname" name="fname" required />
            
            <label for="lname">Last Name <span class="required">*</span></label>
            <input type="text" id="lname" name="lname" required />
            
            <label for="street">Street Address <span class="required">*</span></label>
            <input type="text" id="street" name="street" required />
            
            <label for="city">City <span class="required">*</span></label>
            <input type="text" id="city" name="city" required />
            
            <label for="state">State <span class="required">*</span></label>
            <input type="text" id="state" name="state" required maxlength="2" />
            
            <label for="zip">Zip Code <span class="required">*</span></label>
            <input type="text" id="zip" name="zip" required pattern="[0-9]{5}" />
          </fieldset>
          
          <fieldset>
            <legend>Payment Information</legend>
            
            <label for="cardNumber">Card Number <span class="required">*</span></label>
            <input type="text" id="cardNumber" name="cardNumber" required pattern="[0-9]{16}" placeholder="1234123412341234" />
            
            <label for="expiration">Expiration Date <span class="required">*</span></label>
            <input type="text" id="expiration" name="expiration" required placeholder="MM/YY" />
            
            <label for="code">Security Code <span class="required">*</span></label>
            <input type="text" id="code" name="code" required pattern="[0-9]{3}" placeholder="123" />
          </fieldset>
          
          <fieldset>
            <legend>Order Summary</legend>
            
            <div id="order-summary">
              <p>Item Subtotal: <span id="cart-total">$0.00</span></p>
              <p>Shipping: <span id="shipping-estimate">$0.00</span></p>
              <p>Tax: <span id="tax-estimate">$0.00</span></p>
              <p><strong>Order Total: <span id="order-total">$0.00</span></strong></p>
            </div>
          </fieldset>
          
          <button type="submit" id="checkout-button">Complete Purchase</button>
        </form>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
